[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-toolkit"
version = "0.1.0"
description = "Black-box security scanner for LLM-backed applications, mapped to the OWASP Top 10 for LLM Applications (2025)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Usman Zia", email = "usmanzia600@gmail.com" }]
keywords = ["security", "llm", "ai-security", "owasp", "prompt-injection", "jailbreak", "red-team", "genai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/usmanzia-ux/llm-security-toolkit"
Issues = "https://github.com/usmanzia-ux/llm-security-toolkit/issues"

[project.scripts]
llmsec = "llmsec.cli:main"

[tool.setuptools]
packages = ["llmsec", "llmsec.targets", "llmsec.probes", "llmsec.reporters"]
